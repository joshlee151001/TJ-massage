<title>TJ massage 키오스크</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gaegu:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 세로형 태블릿 — 위에서 아래로 흐르는 한 열, 하단에 떠있는 주문 바. 놀이용이라 손글씨 느낌 폰트와 과장된 이모지 캐릭터를 섞음. */
:root{
  --bg:#FFF4E3;        /* 따뜻한 크림 */
  --paper:#FFFFFF;
  --ink:#2A2016;
  --muted:#8A7A62;
  --line:#F0E3C8;
  --accent:#FF7A59;    /* 복숭아 */
  --accent-ink:#FFFFFF;
  --accent-soft:#FFE1D6;
  --mint:#8EC9B1;
  --sky:#C9D9F2;
  --lav:#D7C9E8;
  --sun:#F7C948;
  --deep:#3E2A1E;
  --f-display:"Gaegu", "Gowun Dodum", system-ui, sans-serif;
  --f-body:"Gowun Dodum", "IBM Plex Sans KR", system-ui, sans-serif;
  --f-ui:"IBM Plex Sans KR", system-ui, sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:19px;line-height:1.5;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(600px 400px at 10% -5%, #FFD9B8 0%, transparent 55%),
  radial-gradient(500px 500px at 110% 20%, #FFE6E0 0%, transparent 55%),
  radial-gradient(700px 400px at -10% 110%, #E6EFFF 0%, transparent 55%);z-index:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-ui)}
h1,h2,.disp{font-family:var(--f-display);letter-spacing:-.01em}
.app{position:relative;z-index:1;min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-top:20px;padding-bottom:220px}

/* 상단 */
header{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.brand{font-family:var(--f-display);font-size:34px;font-weight:700;color:var(--deep);line-height:1}
.brand em{font-style:normal;color:var(--accent)}
.brand small{display:block;font-family:var(--f-ui);font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.14em;margin-top:4px}
.home{margin-left:auto;padding:12px 20px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font-size:16px;box-shadow:0 2px 0 var(--line)}

/* 진행 바 */
.progress{display:flex;align-items:center;gap:8px;margin-bottom:24px;padding:12px;background:var(--paper);border-radius:20px;border:1px solid var(--line);overflow-x:auto}
.pstep{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted);white-space:nowrap;padding:6px 12px;border-radius:999px;flex-shrink:0}
.pstep i{width:28px;height:28px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-style:normal;font-weight:700;color:var(--muted);font-size:14px}
.pstep.on{background:var(--accent-soft);color:var(--deep);font-weight:700}
.pstep.on i{background:var(--accent);color:var(--accent-ink)}
.pstep.done i{background:var(--mint);color:#fff}
.pstep.done{color:var(--mint)}
.pdiv{flex:1;height:2px;background:var(--line);min-width:8px;border-radius:2px}

/* 공통 */
h1{font-size:40px;margin:4px 0 6px;text-wrap:balance;line-height:1.15}
.lead{color:var(--muted);margin:0 0 20px;font-size:17px}
h2{font-size:22px;margin:28px 0 14px;color:var(--deep)}
h2 .q{color:var(--muted);font-size:16px;font-family:var(--f-ui);font-weight:400;margin-left:8px}

/* ---- 대기 화면 ---- */
.attract{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;
  background:linear-gradient(170deg,#FFE4CC 0%,#FFCFBA 55%,#FFB69A 100%);
  padding:60px max(32px,env(safe-area-inset-left,0px)) 48px max(32px,env(safe-area-inset-right,0px))}
.attract .float{position:absolute;font-size:80px;line-height:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.05));animation:bob 6s ease-in-out infinite}
.attract .f1{top:12%;left:8%}
.attract .f2{top:22%;right:10%;animation-delay:-2s}
.attract .f3{top:50%;left:12%;animation-delay:-4s}
.attract .f4{top:60%;right:8%;animation-delay:-1s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-18px) rotate(4deg)}}
.attract .top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
.attract .top .brand{color:var(--deep);font-size:38px}
.attract .top .brand em{color:#D9442C}
.attract .clock{font-family:var(--f-ui);font-size:18px;color:var(--deep);background:rgba(255,255,255,.6);padding:10px 18px;border-radius:999px}
.attract .center{text-align:center;position:relative;z-index:1}
.attract .kicker{display:inline-block;background:var(--deep);color:#FFE4CC;padding:6px 16px;border-radius:999px;font-size:14px;letter-spacing:.14em;font-family:var(--f-ui);margin-bottom:20px}
.attract h1{font-size:72px;color:var(--deep);margin:0;line-height:1.1;font-weight:700}
.attract h1 b{color:#D9442C}
.attract p{color:#5C4432;font-size:20px;max-width:22em;margin:16px auto 0}
.attract .bottom{text-align:center;position:relative;z-index:1}
.attract .go{display:inline-flex;align-items:center;gap:14px;height:88px;padding:0 48px;border-radius:999px;background:var(--deep);color:#FFE4CC;font-family:var(--f-display);font-size:30px;font-weight:700;box-shadow:0 8px 0 rgba(0,0,0,.15);animation:pulse 2.2s ease-in-out infinite}
.attract .go b{font-size:36px;animation:tap 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes tap{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.attract .meta{margin-top:22px;display:flex;gap:20px;justify-content:center;flex-wrap:wrap;font-family:var(--f-ui);font-size:14px;color:#5C4432}
.attract .meta span{background:rgba(255,255,255,.5);padding:8px 14px;border-radius:999px}

/* ---- 코스 카드 ---- */
.courses{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.course{background:var(--paper);border:3px solid transparent;border-radius:26px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;box-shadow:0 3px 0 var(--line);transition:transform .15s}
.course:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.course .emo{font-size:52px;line-height:1}
.course .name{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.1}
.course .d{color:var(--muted);font-size:14px;line-height:1.4;min-height:38px}
.course .foot{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.course .from{font-family:var(--f-ui);font-size:15px;font-weight:600;color:var(--accent)}
.course .tag{font-family:var(--f-ui);font-size:11px;font-weight:700;color:var(--muted);background:var(--line);padding:3px 8px;border-radius:999px;letter-spacing:.08em}
.course.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 3px 0 #E65A3C}
.course.sel .emo{animation:wiggle .6s}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-15deg)}75%{transform:rotate(15deg)}}

/* 색상 변형 */
.course:nth-child(6n+1){background:#FFF}
.course:nth-child(6n+2){background:#F2FBF7}
.course:nth-child(6n+3){background:#FFF8E8}
.course:nth-child(6n+4){background:#F4F0FB}
.course:nth-child(6n+5){background:#F0F6FF}
.course:nth-child(6n+6){background:#FFEEE8}
.course.sel{background:var(--accent-soft)!important}

/* ---- 칩/옵션 ---- */
.row{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:60px;padding:0 22px;border-radius:999px;background:var(--paper);border:2px solid var(--line);font-size:17px;font-weight:600;display:inline-flex;align-items:center;gap:10px;box-shadow:0 2px 0 var(--line)}
.chip:active{transform:translateY(1px);box-shadow:0 1px 0 var(--line)}
.chip .sub{font-size:13px;color:var(--muted);font-weight:400;font-family:var(--f-ui)}
.chip.sel{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);box-shadow:0 2px 0 #E65A3C}
.chip.sel .sub{color:var(--accent-soft)}
.chip:disabled{opacity:.4}
.chip.dur{min-width:120px;flex-direction:column;justify-content:center;gap:0;padding:12px 24px}
.chip.dur b{font-size:22px;font-family:var(--f-display)}

.stepper{display:inline-flex;align-items:stretch;background:var(--paper);border:2px solid var(--line);border-radius:999px;overflow:hidden;box-shadow:0 2px 0 var(--line)}
.stepper button{width:72px;font-size:30px;color:var(--accent);font-weight:700}
.stepper output{min-width:120px;text-align:center;font-size:24px;font-weight:700;font-family:var(--f-display);align-self:center;color:var(--deep)}

/* ---- 정보 입력 ---- */
.phone-display{font-family:var(--f-ui);font-size:40px;font-weight:600;letter-spacing:.04em;background:var(--paper);border-radius:20px;padding:20px 24px;min-height:60px;border:2px dashed var(--line);text-align:center}
.phone-display .ph{color:var(--line)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.pad button{height:76px;border-radius:20px;background:var(--paper);font-size:30px;font-weight:600;border:1px solid var(--line);box-shadow:0 3px 0 var(--line);font-family:var(--f-ui)}
.pad button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.pad button.fn{font-size:16px;color:var(--muted);font-family:var(--f-ui)}
.field{width:100%;box-sizing:border-box;height:62px;border-radius:16px;border:2px solid var(--line);background:var(--paper);padding:0 18px;font:inherit;font-size:20px;color:var(--ink);font-family:var(--f-ui)}
.check{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 18px;border-radius:16px;background:var(--paper);border:2px solid var(--line);text-align:left;width:100%;box-sizing:border-box;font-size:16px}
.check i{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-style:normal;font-size:17px;color:var(--accent-ink);font-weight:700}
.check.sel{border-color:var(--accent);background:#FFF}
.check.sel i{background:var(--accent);border-color:var(--accent)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:15px;color:#C94A2E;margin-top:10px;background:#FFECE4;padding:12px 16px;border-radius:14px}

/* ---- 결제 ---- */
.pays{display:grid;grid-template-columns:1fr;gap:12px}
.pay{background:var(--paper);border:3px solid transparent;border-radius:22px;padding:22px 24px;text-align:left;display:flex;align-items:center;gap:18px;box-shadow:0 3px 0 var(--line);min-height:92px}
.pay .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:32px;flex:none}
.pay:nth-child(1) .ic{background:#FFE1D6}
.pay:nth-child(2) .ic{background:#D9EDFF}
.pay:nth-child(3) .ic{background:#DFF2E6}
.pay b{font-size:22px;font-family:var(--f-display)}
.pay span{color:var(--muted);font-size:15px;display:block}
.pay.sel{border-color:var(--accent);background:var(--accent-soft)}
.processing{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:60px 20px}
.processing .emo{font-size:84px;animation:beat 1.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

/* ---- 하단 주문 바 ---- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--paper);border-top:1px solid var(--line);box-shadow:0 -8px 32px rgba(42,32,22,.08);
  padding:16px max(20px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-right,0px));
  transition:transform .3s cubic-bezier(.3,1.2,.5,1)}
.dock.hidden{transform:translateY(100%)}
.dock .bar{display:flex;align-items:center;gap:14px}
.dock .handle{width:40px;height:5px;background:var(--line);border-radius:3px;position:absolute;top:7px;left:50%;transform:translateX(-50%)}
.dock .sum{flex:1;min-width:0}
.dock .sum .lbl{font-family:var(--f-ui);font-size:12px;color:var(--muted);letter-spacing:.08em;font-weight:600}
.dock .sum .total{font-family:var(--f-display);font-size:34px;font-weight:700;color:var(--deep);line-height:1.1}
.dock .sum .items{color:var(--muted);font-size:14px;font-family:var(--f-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock .btn{height:68px;padding:0 28px;border-radius:20px;font-family:var(--f-display);font-size:22px;font-weight:700;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 #E65A3C}
.dock .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #E65A3C}
.dock .btn:disabled{background:var(--line);color:var(--muted);box-shadow:0 4px 0 #D9CCB0;cursor:not-allowed}
.dock .back{height:68px;width:68px;border-radius:20px;background:var(--bg);border:2px solid var(--line);font-size:28px}
.dock .expand{position:absolute;inset:0;top:0;background:transparent;z-index:0}
.dock .handle{z-index:1}
.dock .bar{position:relative;z-index:2}

.sheet{position:fixed;inset:0;z-index:8;display:flex;align-items:flex-end;justify-content:center;background:rgba(42,32,22,.5);opacity:0;pointer-events:none;transition:opacity .2s}
.sheet.open{opacity:1;pointer-events:auto}
.sheet .inner{background:var(--paper);border-radius:28px 28px 0 0;width:100%;max-height:80vh;padding:24px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));box-sizing:border-box;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.3,1.2,.5,1)}
.sheet.open .inner{transform:translateY(0)}
.sheet h3{margin:0;font-family:var(--f-display);font-size:28px;display:flex;justify-content:space-between;align-items:center}
.sheet h3 button{font-size:28px;color:var(--muted);width:40px;height:40px}
.lines{overflow:auto;display:flex;flex-direction:column;gap:12px;padding:16px 0;border-top:1px dashed var(--line);margin-top:12px}
.ln{display:flex;justify-content:space-between;gap:12px;font-size:16px}
.ln span:first-child{color:var(--muted);font-family:var(--f-ui)}
.ln span:last-child{font-weight:600;font-family:var(--f-ui)}
.sheet .ftot{border-top:2px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;font-family:var(--f-display);font-size:28px;font-weight:700}

/* ---- 완료 ---- */
.done{text-align:center;padding:20px 0 40px}
.done .emo{font-size:120px;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.done h1{font-size:44px;margin:12px 0 8px}
.ticket{background:var(--paper);border-radius:28px;padding:28px;margin:24px 0;box-shadow:0 4px 0 var(--line);position:relative;overflow:hidden}
.ticket::before,.ticket::after{content:"";position:absolute;width:28px;height:28px;background:var(--bg);border-radius:50%;top:50%;transform:translateY(-50%)}
.ticket::before{left:-14px}.ticket::after{right:-14px}
.ticket .big{font-family:var(--f-display);font-size:72px;font-weight:700;color:var(--accent);line-height:1}
.ticket .row2{display:flex;justify-content:space-around;margin-top:18px;padding-top:18px;border-top:1px dashed var(--line)}
.ticket .row2 div span{display:block;font-size:13px;color:var(--muted);font-family:var(--f-ui);letter-spacing:.08em;font-weight:600}
.ticket .row2 div b{font-family:var(--f-display);font-size:26px;color:var(--deep)}
.done .again{height:68px;padding:0 40px;border-radius:20px;background:var(--deep);color:#FFE4CC;font-family:var(--f-display);font-size:22px;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.2)}

/* ---- 유휴 ---- */
.idle{position:fixed;inset:0;background:rgba(42,32,22,.5);display:grid;place-items:center;z-index:20;padding:20px}
.idle .box{background:var(--paper);border-radius:28px;padding:36px;max-width:420px;text-align:center;display:flex;flex-direction:column;gap:16px;box-shadow:0 8px 0 rgba(0,0,0,.1)}
.idle .emo{font-size:64px}
.idle h2{margin:0;font-size:30px}
.idle .btn{height:68px;border-radius:20px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-size:22px;font-weight:700;box-shadow:0 4px 0 #E65A3C;border:0;cursor:pointer}

/* ---- 관리자 ---- */
.admin{position:fixed;inset:0;background:#15232B;color:#E6EEF2;overflow:auto;z-index:30;padding:24px max(20px,env(safe-area-inset-left,0px)) 40px max(20px,env(safe-area-inset-right,0px))}
.admin-pin{position:fixed;inset:0;background:#15232B;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:40px 20px}
.pin-display{font-family:var(--f-ui);font-size:48px;letter-spacing:.5em;color:#F7E4C9;padding:10px 20px 10px 40px;background:#2A3E4A;border-radius:16px;min-width:200px;text-align:center}
.admin-pin .pad{max-width:340px;width:100%}
.admin-pin .pad button{background:#2A3E4A;color:#E6EEF2;border-color:#3D5665;box-shadow:0 3px 0 #0E1A20}
.admin-pin .pad button.fn{color:#9FB1BC}
.admin-tabs{display:flex;gap:6px;margin:16px 0 20px;overflow-x:auto;padding-bottom:4px}
.admin-tabs button{padding:12px 22px;border-radius:12px;background:#1F2F38;color:#9FB1BC;font-family:var(--f-ui);font-size:16px;font-weight:600;white-space:nowrap;border:1px solid #2A3E4A}
.admin-tabs button.on{background:#C9A24B;color:#15232B}
.admin h2{color:#E6EEF2;font-family:var(--f-ui);font-size:16px;font-weight:600;letter-spacing:.08em;margin:28px 0 14px;text-transform:uppercase;color:#9FB1BC}

.cards{display:flex;flex-direction:column;gap:12px}
.acard{background:#1F2F38;border-radius:16px;padding:18px;border-left:4px solid #3D5665}
.acard.hot{border-left-color:#C9A24B}
.acard.warn{border-left-color:#E67E4C}
.arow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ano{font-family:var(--f-ui);font-size:22px;font-weight:700;color:#F7E4C9}
.aname{font-family:var(--f-ui);font-size:17px;margin-top:6px}
.afoot{display:flex;justify-content:space-between;margin-top:10px;color:#9FB1BC;font-family:var(--f-ui);font-size:14px;flex-wrap:wrap;gap:8px}
.astat{padding:4px 12px;border-radius:999px;font-family:var(--f-ui);font-size:13px;font-weight:700}
.s-on{background:#C9A24B;color:#15232B}
.s-wait{background:#E67E4C;color:#15232B}
.s-res{background:#3D5665;color:#E6EEF2}
.s-rest{background:#5A6D7A;color:#15232B}
.aactions{display:flex;gap:8px;margin-top:12px}
.aact{height:44px;padding:0 16px;border-radius:10px;background:#2A3E4A;color:#E6EEF2;font-family:var(--f-ui);font-size:14px;font-weight:600}
.aact.primary{background:#C9A24B;color:#15232B}

.rgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.rbox{background:#1F2F38;border-radius:16px;padding:20px;min-height:120px}
.rbox.busy{background:#2A3E4A;border:2px solid #C9A24B}
.rbox.free{border:2px dashed #3D5665}
.rid{font-family:var(--f-display);font-size:36px;font-weight:700;color:#F7E4C9;line-height:1}
.rtype{font-family:var(--f-ui);font-size:13px;color:#9FB1BC;margin-top:4px}
.rguest{font-family:var(--f-ui);font-size:18px;color:#C9A24B;font-weight:700;margin-top:10px}
.runtil{font-family:var(--f-ui);font-size:14px;color:#9FB1BC}
.rfree{font-family:var(--f-ui);font-size:14px;color:#5A6D7A;margin-top:14px}

.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.kpi{background:#1F2F38;border-radius:16px;padding:18px}
.kpi span{display:block;font-family:var(--f-ui);font-size:12px;color:#9FB1BC;letter-spacing:.08em;font-weight:600;text-transform:uppercase}
.kpi b{display:block;font-family:var(--f-ui);font-size:22px;color:#F7E4C9;margin-top:6px;font-weight:700}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:120px 1fr 40px;align-items:center;gap:12px;font-family:var(--f-ui);font-size:15px}
.btrack{height:24px;background:#1F2F38;border-radius:12px;overflow:hidden}
.bfill{height:100%;background:linear-gradient(90deg,#C9A24B,#E67E4C);border-radius:12px}

.chip-item{display:inline-flex;align-items:center;gap:8px;background:#1F2F38;border:1px solid #2A3E4A;padding:6px 6px 6px 16px;border-radius:999px;font-family:var(--f-ui);font-size:14px;color:#E6EEF2}
.chip-item .aact{height:30px;padding:0 10px;font-size:12px}
.wait-widget{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;background:#1F2F38;border:1px solid #2A3E4A;padding:18px;border-radius:16px;margin-bottom:18px}
.wait-block{display:flex;flex-direction:column;gap:6px}
.wait-block>span{font-family:var(--f-ui);font-size:11px;letter-spacing:.14em;color:#9FB1BC;text-transform:uppercase;font-weight:600}
.wait-block b{font-family:var(--f-display);font-size:22px;color:#F7E4C9;min-width:70px;text-align:center}
.wnum{display:flex;align-items:center;gap:8px}
.empty-state{text-align:center;padding:50px 20px;border:2px dashed #2A3E4A;border-radius:16px;background:#1F2F38}
.einput{width:100%;box-sizing:border-box;background:#2A3E4A;border:1px solid #3D5665;color:#F7E4C9;font:inherit;font-family:var(--f-ui);font-size:17px;padding:12px 16px;border-radius:8px}
.einput:focus{outline:2px solid #C9A24B;outline-offset:1px}
.aact:hover{background:#3D5665}


.mbg{position:fixed;inset:0;background:rgba(21,35,43,.75);z-index:40;display:grid;place-items:center;padding:16px}
.mbox{background:#1F2F38;border:1px solid #2A3E4A;padding:28px;max-width:420px;width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;border-radius:16px}
.mtitle{margin:0 0 4px;font-family:var(--f-display);font-size:26px;color:#F7E4C9}
.mlbl{font-family:var(--f-ui);font-size:11px;letter-spacing:.14em;color:#9FB1BC;text-transform:uppercase;font-weight:600;margin-top:6px}
.mbox .opt{min-height:48px;padding:0 20px;background:#2A3E4A;border:2px solid #3D5665;color:#E6EEF2;font-family:var(--f-ui);font-size:15px;font-weight:500;display:inline-flex;align-items:center;border-radius:12px}
.mbox .opt.sel{background:#C9A24B;color:#15232B;border-color:#C9A24B}
.mbtns{display:flex;gap:10px;margin-top:12px}
.mbtns button{flex:1;height:48px;border-radius:10px}
.mbtns button.primary{flex:2}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#F7E4C9;color:#15232B;padding:14px 24px;font-family:var(--f-ui);font-size:14px;z-index:50;cursor:pointer;border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.3);font-weight:600}

@media (max-width:640px){
  .courses{grid-template-columns:1fr}
  .checks{grid-template-columns:1fr}
  .attract h1{font-size:52px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

<div id="root"></div>

<script>
const COURSES=[
  {id:'thai',emo:'🧘‍♀️',name:'타이 마사지',tag:'건식',desc:'스트레칭과 지압으로 몸이 쭉~ 펴져요',prices:{60:60000,90:85000,120:110000}},
  {id:'aroma',emo:'🌿',name:'아로마 오일',tag:'오일',desc:'향긋한 오일로 사르르 녹아들어요',prices:{60:70000,90:95000,120:120000}},
  {id:'deep',emo:'💪',name:'딥티슈',tag:'오일',desc:'뭉친 근육을 깊~게 풀어드려요',prices:{60:75000,90:100000}},
  {id:'foot',emo:'🦶',name:'발 마사지',tag:'건식',desc:'하루 종일 수고한 발에게 선물을',prices:{30:35000,60:55000}},
  {id:'head',emo:'💆‍♀️',name:'헤드 & 숄더',tag:'건식',desc:'머리·목·어깨 집중 케어',prices:{30:30000,60:50000}},
  {id:'hot',emo:'🪨',name:'핫스톤',tag:'오일',desc:'따끈한 돌이 몸속 깊이 스며들어요',prices:{60:80000,90:110000}}
];
const ADDONS=[
  {id:'footbath',emo:'🛀',name:'족욕 10분',price:10000},
  {id:'scalp',emo:'✨',name:'헤드스파',price:20000},
  {id:'eye',emo:'👁',name:'눈 찜질팩',price:5000},
  {id:'tea',emo:'🍵',name:'허브차',price:3000}
];
let FOCUS=[['목·어깨','😣'],['등','🫠'],['허리','🥲'],['팔','💪'],['다리','🦵'],['발','🦶']];
let PRESSURES=['살살','보통','세게'];
const STEPS=['코스','옵션','시간','정보','결제'];
const IDLE_SEC=60,IDLE_WARN=15;

let S,idleT=0,idleWarn=false,warnLeft=IDLE_WARN,doneLeft=0,ticketNo=42,sheetOpen=false;
let ADMIN={on:false,pin:'',tab:'queue'};
let QUEUE=[];
let ROOMS=[
  {id:'R1',type:'1인실',guest:null,until:null},
  {id:'R4',type:'1인실',guest:null,until:null},
  {id:'R5',type:'1인실',guest:null,until:null},
  {id:'R7',type:'1인실',guest:null,until:null},
  {id:'C2',type:'커플룸',guest:null,until:null}
];
let STAFF=[
  {name:'민지',role:'여성',status:'대기',until:null},
  {name:'수연',role:'여성',status:'대기',until:null},
  {name:'태호',role:'남성',status:'대기',until:null}
];
let STATS={revenue:0,orders:0};
let WAIT={count:0,minutes:0};
function fresh(){S={step:0,course:null,dur:null,pressure:'보통',focus:[],addons:[],people:1,time:null,phone:'',health:[],consent:false,pay:null,processing:false,ticket:null};sheetOpen=false;ADMIN.on=false;ADMIN.pin='';ADMIN.tab='queue'}
fresh();

/* 관리자 롱프레스 */
let pressT=null;
function startPress(){clearTimeout(pressT);pressT=setTimeout(()=>{ADMIN.on='pin';render()},2000)}
function endPress(){clearTimeout(pressT)}

const won=n=>n.toLocaleString('ko-KR')+'원';
const course=()=>COURSES.find(c=>c.id===S.course);
const unit=()=>{const c=course();if(!c||!S.dur)return 0;return c.prices[S.dur]+S.addons.reduce((a,id)=>a+ADDONS.find(x=>x.id===id).price,0)};
const total=()=>unit()*S.people;
const fmtPhone=p=>p.length<4?p:p.length<8?p.slice(0,3)+'-'+p.slice(3):p.slice(0,3)+'-'+p.slice(3,7)+'-'+p.slice(7);
const hm=d=>String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');

function slots(){
  const n=new Date();const d=new Date(n);d.setSeconds(0,0);d.setMinutes(d.getMinutes()<30?30:60);
  const out=[];for(let i=0;i<6;i++){const t=new Date(d.getTime()+i*30*60000);out.push({v:hm(t),full:i===2})}return out;
}
function startAt(){return S.time==='now'?hm(new Date(Date.now()+15*60000)):S.time}

function canNext(){
  switch(S.step){
    case 1:return !!(S.course&&S.dur);
    case 2:return true;
    case 3:return !!S.time;
    case 4:return S.phone.length>=10&&S.consent;
    case 5:return !!S.pay;
  }return false;
}

/* ---- 뷰 ---- */
function vAttract(){
  return `<div class="attract">
    <span class="float f1">🌸</span><span class="float f2">🍃</span><span class="float f3">💆‍♀️</span><span class="float f4">✨</span>
    <div class="top"><div class="brand">TJ<em>.</em><br><small>TJ MASSAGE</small></div><div class="clock" id="clock">${hm(new Date())}</div></div>
    <div class="center">
      <div class="kicker">SELF CHECK-IN · 셀프 접수</div>
      <h1>오늘의 피로,<br><b>푹~ 녹여드려요</b></h1>
      <p>2분이면 접수 끝! 터치 한 번으로 시작해요</p>
    </div>
    <div class="bottom">
      <button class="go" data-act="start">터치하여 시작 <b>👉</b></button>
      <div class="meta"><span>🕙 10:00 - 02:00</span><span>⏱ ${WAIT.count>0?'대기 '+WAIT.count+'명 · 약 '+WAIT.minutes+'분':'대기 없음'}</span><span>🪑 ${ROOMS.filter(r=>!r.guest).length}자리 비어있음</span></div>
    </div>
  </div>`;
}

function vCourse(){
  const c=course();
  return `<h1>어떤 코스가 끌리세요?</h1><p class="lead">마음에 드는 걸 하나 골라주세요 ✨</p>
  <div class="courses">${COURSES.map(x=>{
    const ps=Object.entries(x.prices);
    return `<button class="course ${S.course===x.id?'sel':''}" data-act="course" data-v="${x.id}">
      <span class="emo">${x.emo}</span>
      <div class="name">${x.name}</div>
      <div class="d">${x.desc}</div>
      <div class="foot"><span class="from">${ps[0][0]}분부터 ${won(ps[0][1])}</span><span class="tag">${x.tag}</span></div>
    </button>`;
  }).join('')}</div>
  ${c?`<h2>⏰ 몇 분으로 하시겠어요?</h2><div class="row">${Object.entries(c.prices).map(([m,p])=>`<button class="chip dur ${S.dur==m?'sel':''}" data-act="dur" data-v="${m}"><b>${m}분</b><span class="sub">${won(p)}</span></button>`).join('')}</div>`:''}`;
}

function vOptions(){
  return `<h1>취향대로 맞춰볼까요?</h1><p class="lead">선택 안 하면 기본으로 진행돼요</p>
  <h2>💪 압 세기</h2>
  <div class="row">${PRESSURES.map(v=>`<button class="chip ${S.pressure===v?'sel':''}" data-act="set" data-k="pressure" data-v="${v}">${v==='살살'?'🪶':v==='보통'?'👌':v==='세게'?'🔥':'✨'} ${v}</button>`).join('')}</div>
  <h2>🎯 특히 아픈 곳 <span class="q">여러 개 선택 가능</span></h2>
  <div class="row">${FOCUS.map(([f,e])=>`<button class="chip ${S.focus.includes(f)?'sel':''}" data-act="toggle" data-k="focus" data-v="${f}">${e} ${f}</button>`).join('')}</div>
  <h2>➕ 추가하면 더 좋아요</h2>
  <div class="row">${ADDONS.map(a=>`<button class="chip ${S.addons.includes(a.id)?'sel':''}" data-act="toggle" data-k="addons" data-v="${a.id}">${a.emo} ${a.name}<span class="sub">+${won(a.price)}</span></button>`).join('')}</div>`;
}

function vTime(){
  return `<h1>언제 받으시나요?</h1><p class="lead">바로 시작할 수도, 조금 뒤로 미룰 수도 있어요</p>
  <h2>👥 몇 분이서?</h2>
  <div class="stepper"><button data-act="people" data-v="-1" aria-label="줄이기">−</button><output>${S.people}명</output><button data-act="people" data-v="1" aria-label="늘리기">+</button></div>
  <p class="lead" style="margin-top:10px;font-size:15px">${S.people===2?'💞 커플룸으로 안내해드려요':S.people>2?'🏡 넓은 룸으로 함께 안내':'🛏 1인 전용 룸'}</p>
  <h2>🕐 시작 시간</h2>
  <div class="row"><button class="chip ${S.time==='now'?'sel':''}" data-act="time" data-v="now">⚡ 지금 바로<span class="sub">약 15분 대기</span></button></div>
  <div class="row" style="margin-top:10px">${slots().map(s=>`<button class="chip ${S.time===s.v?'sel':''}" data-act="time" data-v="${s.v}" ${s.full?'disabled':''}>${s.v}${s.full?'<span class="sub">마감</span>':''}</button>`).join('')}</div>`;
}

function vInfo(){
  return `<h1>마지막으로 번호만!</h1><p class="lead">순서가 되면 문자로 알려드려요 📱</p>
  <div class="phone-display num">${S.phone?fmtPhone(S.phone):'<span class="ph">010-0000-0000</span>'}</div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="key" data-v="${n}">${n}</button>`).join('')}
    <button class="fn" data-act="keyclr">전체 지움</button><button data-act="key" data-v="0">0</button><button class="fn" data-act="keydel">⌫ 한 글자</button></div>
  <h2>🩺 몸 상태 체크 <span class="q">해당되면 눌러주세요</span></h2>
  <div class="checks">${['임신 중','수술 6개월 내','고혈압','피부 상처','해당 없음 😊'].map(h=>`<button class="check ${S.health.includes(h)?'sel':''}" data-act="health" data-v="${h}"><i>${S.health.includes(h)?'✓':''}</i>${h}</button>`).join('')}</div>
  <h2>📝 동의</h2>
  <button class="check ${S.consent?'sel':''}" data-act="consent" style="min-height:72px;font-size:17px"><i>${S.consent?'✓':''}</i>개인정보 수집·이용에 동의합니다</button>`;
}

function vPay(){
  if(S.processing){
    const em={card:'💳',easy:'📱',counter:'🏃‍♀️'}[S.pay];
    const m={card:'카드를 꽂아주세요',easy:'휴대폰을 올려주세요',counter:'카운터로 전송 중...'}[S.pay];
    return `<div class="processing"><div class="emo">${em}</div><h1>${m}</h1><p class="lead num" style="font-size:24px">${won(total())}</p></div>`;
  }
  const p=(id,em,t,s)=>`<button class="pay ${S.pay===id?'sel':''}" data-act="pay" data-v="${id}"><div class="ic">${em}</div><div><b>${t}</b><span>${s}</span></div></button>`;
  return `<h1>어떻게 결제할까요?</h1><p class="lead">편한 방법으로 골라주세요 💰</p>
  <div class="pays">${p('card','💳','카드로','신용·체크카드')}${p('easy','📱','간편결제','삼성·애플·카카오페이')}${p('counter','🏃‍♀️','나중에 카운터에서','관리 후 결제')}</div>`;
}

function vDone(){
  const c=course();
  return `<div class="done">
    <div class="emo">🎉</div>
    <h1>카운터로 가세요!</h1>
    <p class="lead">접수가 완료되었습니다</p>
    <div class="ticket">
      <div style="font-family:var(--f-ui);font-size:13px;color:var(--muted);letter-spacing:.08em;font-weight:600">접수 번호</div>
      <div class="big num">${S.ticket.no}</div>
      <div class="row2">
        <div><span>시작 예정</span><b class="num">${S.ticket.at}</b></div>
        <div><span>배정 룸</span><b>${S.ticket.room}</b></div>
        <div><span>코스</span><b>${c.emo} ${S.dur}분</b></div>
      </div>
    </div>
    <p class="lead" style="font-size:15px">📱 ${fmtPhone(S.phone)}로 알림을 보냈어요</p>
    <button class="again" data-act="home">처음으로 (${doneLeft}초)</button>
  </div>`;
}

function vDock(){
  if(S.step===0||S.step===6||S.processing)return '<div class="dock hidden"></div>';
  const c=course();
  const items=[];
  if(c)items.push(`${c.name} ${S.dur?S.dur+'분':''}`);
  if(S.addons.length)items.push(S.addons.map(id=>ADDONS.find(a=>a.id===id).name).join(' · '));
  if(S.people>1)items.push(S.people+'명');
  const label=S.step===5?(S.pay==='counter'?'접수하기 ✓':'결제하기 💳'):'다음 →';
  return `<div class="dock">
    <button class="expand" data-act="opensheet" aria-label="주문서 열기"></button>
    <div class="handle"></div>
    <div class="bar">
      ${S.step>1?'<button class="back" data-act="back" aria-label="이전">←</button>':''}
      <div class="sum">
        <div class="lbl">합계</div>
        <div class="total num">${won(total())}</div>
        <div class="items">${items.join(' · ')||'코스를 골라주세요'}</div>
      </div>
      <button class="btn" data-act="next" ${canNext()?'':'disabled'}>${label}</button>
    </div>
  </div>`;
}

function vSheet(){
  const c=course();
  const L=[];
  if(c){L.push(['코스',c.name+(S.dur?` ${S.dur}분`:'')]);if(S.dur)L.push(['기본',won(c.prices[S.dur])])}
  if(S.step>=2){L.push(['압 세기',S.pressure]);if(S.focus.length)L.push(['집중 부위',S.focus.join(', ')])}
  S.addons.forEach(id=>{const a=ADDONS.find(x=>x.id===id);L.push(['+ '+a.emo+' '+a.name,won(a.price)])});
  if(S.step>=3){L.push(['인원',S.people+'명']);if(S.time)L.push(['시작',S.time==='now'?'지금 ('+startAt()+'경)':S.time])}
  if(S.phone.length>=10)L.push(['연락처',fmtPhone(S.phone)]);
  return `<div class="sheet ${sheetOpen?'open':''}" data-act="closesheet"><div class="inner" onclick="event.stopPropagation()">
    <h3>📋 주문서<button data-act="closesheet">×</button></h3>
    <div class="lines">${L.length?L.map(([k,v])=>`<div class="ln"><span>${k}</span><span class="num">${v}</span></div>`).join(''):'<div style="color:var(--muted);text-align:center;padding:20px">선택한 내용이 여기에 정리돼요</div>'}</div>
    <div class="ftot"><span>합계</span><span class="num">${won(total())}</span></div>
  </div></div>`;
}

function vAdmin(){
  if(ADMIN.on==='pin'){
    return `<div class="admin-pin">
      <h1 style="color:#fff;margin:0 0 12px">관리자 모드</h1>
      <p class="lead" style="color:#B5C4CE">PIN을 입력하세요 (기본: 0517)</p>
      <div class="pin-display">${'●'.repeat(ADMIN.pin.length).padEnd(4,'○')}</div>
      <div class="pad" style="max-width:320px">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="apin" data-v="${n}">${n}</button>`).join('')}
        <button class="fn" data-act="apinclr">지움</button><button data-act="apin" data-v="0">0</button><button class="fn" data-act="exitadmin">취소</button></div>
    </div>`;
  }
  if(ADMIN.on==='edit')return vEdit();
  const tabs=[['queue','📋 대기열'],['rooms','🏠 룸 현황'],['staff','👥 관리사'],['stats','📊 매출'],['menu','🧾 메뉴 관리']];
  return `<div class="admin">
    <header style="color:#E6EEF2"><div class="brand" style="color:#F7E4C9">TJ<em style="color:#C9A24B">.</em><small style="color:#9FB1BC">ADMIN</small></div>
      <div style="margin-left:auto;display:flex;gap:10px;align-items:center">
        <span style="font-family:var(--f-ui);font-size:14px;color:#9FB1BC">${new Date().toLocaleString('ko-KR',{month:'long',day:'numeric',weekday:'short'})} · <span id="clock2">${hm(new Date())}</span></span>
        <button class="home" data-act="exitadmin" style="background:#2A3E4A;border-color:#3D5665;color:#E6EEF2">나가기</button>

function render(){
  const root=document.getElementById('root');
  if(ADMIN.on){root.innerHTML=vAdmin()+vModal();return}
  if(S.step===0){root.innerHTML=vAttract()+idleHTML();return}
  const view=[null,vCourse,vOptions,vTime,vInfo,vPay,vDone][S.step]();
  const steps=STEPS.map((s,i)=>{
    const n=i+1,cls=n===S.step?'on':n<S.step?'done':'';
    return `<div class="pstep ${cls}"><i>${n<S.step?'✓':n}</i>${s}</div>${i<STEPS.length-1?'<div class="pdiv"></div>':''}`;
  }).join('');
  const sc=document.scrollingElement;const keep=root.dataset.step==S.step?sc.scrollTop:0;
  root.innerHTML=`<div class="app">
    <header><div class="brand">TJ<em>.</em><small>TJ MASSAGE</small></div><button class="home" data-act="home">처음으로</button></header>
    ${S.step<6?`<div class="progress">${steps}</div>`:''}
    <main>${view}</main>
  </div>${vDock()}${vSheet()}${idleHTML()}`;
  root.dataset.step=S.step;
  sc.scrollTop=keep;
}
function idleHTML(){

}

/* 트리플 탭으로 관리자 진입 (대기 화면 시계 또는 상단 시간) */
let tapTimes=[];
document.addEventListener('pointerdown',e=>{
  if(ADMIN.on)return;
  const c=e.target.closest('#clock, #clock2, .clock, .step-counter');
  if(!c)return;
  const now=Date.now();
  tapTimes=tapTimes.filter(t=>now-t<800);
  tapTimes.push(now);
  if(tapTimes.length>=3){tapTimes=[];ADMIN.on='pin';ADMIN.pin='';render()}
});

/* 입력 */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t||t.disabled)return;
  const a=t.dataset.act,v=t.dataset.v;
  switch(a){
    case 'noop':return;
    case 'apin':if(ADMIN.pin.length<4)ADMIN.pin+=v;if(ADMIN.pin.length===4){if(ADMIN.pin==='0517'){ADMIN.on=true;ADMIN.pin=''}else{ADMIN.pin='';render();ADMIN.toast='비밀번호가 틀렸어요';return}}break;
    case 'apinclr':ADMIN.pin='';break;
    case 'exitadmin':ADMIN.on=false;ADMIN.pin='';break;
    case 'atab':ADMIN.tab=v;ADMIN.form=null;ADMIN.toast='';break;
    case 'mfield':ADMIN.form[t.dataset.k]=document.querySelector('[data-mk="'+t.dataset.k+'"]').value;break;
    case 'mradio':ADMIN.form[t.dataset.k]=v;break;
    case 'cancelform':ADMIN.form=null;break;
    case 'okform':{const F=ADMIN.form;if(!F)break;const nameInput=document.querySelector('[data-mk="name"]');if(nameInput)F.name=nameInput.value.trim();const emoInput=document.querySelector('[data-mk="emo"]');if(emoInput)F.emo=emoInput.value.trim();if(!F.name){ADMIN.toast='이름을 입력해주세요';break}
      if(F.kind==='newstaff'){STAFF.push({name:F.name,role:F.role,status:F.role==='여성'||F.role==='남성'?'대기':'대기중',until:null});ADMIN.toast='관리사가 추가되었어요'}
      else if(F.kind==='newroom'){ROOMS.push({id:F.name,type:F.type,guest:null,until:null});ADMIN.toast='룸이 추가되었어요'}
      else if(F.kind==='addlist'){if(F.subk==='pressures')PRESSURES.push(F.name);else{FOCUS.push(typeof FOCUS[0]==='string'?F.name:[F.name,F.emo||''])}ADMIN.toast='추가되었어요'}
      else if(F.kind==='editlist'){const arr=F.subk==='pressures'?PRESSURES:FOCUS;if(typeof arr[F.idx]==='string')arr[F.idx]=F.name;else arr[F.idx]=[F.name,F.emo||''];ADMIN.toast='수정되었어요'}
      ADMIN.form=null;break}
    case 'closetoast':ADMIN.toast='';break;
    case 'wait':{const k=t.dataset.k;WAIT[k]=Math.max(0,WAIT[k]+(+v));break}
    case 'delqueue':{const i=QUEUE.findIndex(q=>q.no===v);if(i>=0){const q=QUEUE[i];ROOMS.forEach(r=>{if(r.guest===q.no){r.guest=null;r.until=null}});QUEUE.splice(i,1)}}break;
    case 'startnow':{const q=QUEUE.find(x=>x.no===v);if(q){q.status='관리중';q.start=hm(new Date());const r=ROOMS.find(rr=>!rr.guest&&(q.people>=2?rr.type==='커플룸':rr.type==='1인실'));if(r){r.guest=q.no;q.room=r.id}}break}
    case 'finish':{const i=QUEUE.findIndex(q=>q.no===v);if(i>=0){const q=QUEUE[i];ROOMS.forEach(r=>{if(r.guest===q.no){r.guest=null;r.until=null}});QUEUE.splice(i,1)}break}
    case 'newroom':ADMIN.form={kind:'newroom',title:'룸 추가',name:'',type:'1인실'};break;
    case 'delroom':{const i=+t.dataset.i;if(ROOMS[i].guest){ADMIN.toast='사용 중인 룸은 삭제할 수 없어요';break}ROOMS.splice(i,1);ADMIN.toast='룸이 삭제되었어요';break}
    case 'newstaff':ADMIN.form={kind:'newstaff',title:'관리사 추가',name:'',role:'F'};break;
    case 'togglestaff':{const i=+t.dataset.i;const s=STAFF[i];s.status=s.status==='관리중'?'대기':'관리중';s.until=s.status==='관리중'?hm(new Date(Date.now()+60*60000)):null;break}
    case 'delstaff':{STAFF.splice(+t.dataset.i,1)}break;
    case 'resetstats':{STATS.revenue=0;STATS.orders=0}break;
    case 'assign':case 'call':/* 데모 */break;
    case 'newcourse':ADMIN.on='edit';ADMIN.edit={kind:'course',isNew:true,id:'c'+Date.now(),emo:'🌿',name:'',tag:'건식',desc:'',pricesArr:[[60,50000]]};break;
    case 'editcourse':{const c=COURSES.find(x=>x.id===v);ADMIN.on='edit';ADMIN.edit={kind:'course',isNew:false,id:c.id,emo:c.emo,name:c.name,tag:c.tag,desc:c.desc,pricesArr:Object.entries(c.prices).map(([m,p])=>[+m,p])};break}
    case 'delcourse':{const i=COURSES.findIndex(x=>x.id===v);if(i>=0)COURSES.splice(i,1)}break;
    case 'newaddon':ADMIN.on='edit';ADMIN.edit={kind:'addon',isNew:true,id:'a'+Date.now(),emo:'✨',name:'',price:10000};break;
    case 'editaddon':{const a=ADDONS.find(x=>x.id===v);ADMIN.on='edit';ADMIN.edit={kind:'addon',isNew:false,id:a.id,emo:a.emo,name:a.name,price:a.price};break}
    case 'deladdon':{const i=ADDONS.findIndex(x=>x.id===v);if(i>=0)ADDONS.splice(i,1)}break;
    case 'addlist':ADMIN.form={kind:'addlist',subk:t.dataset.k,title:t.dataset.k==='pressures'?'압 세기 추가':'부위 추가',name:'',emo:'✨'};break;
    case 'editlist':{const k=t.dataset.k,i=+t.dataset.i;const cur=k==='pressures'?PRESSURES[i]:FOCUS[i][0];const emo=k==='pressures'?'':FOCUS[i][1];ADMIN.form={kind:'editlist',subk:k,idx:i,title:k==='pressures'?'압 세기 수정':'부위 수정',name:cur,emo:emo||'✨'};break}
    case 'dellist':{const k=t.dataset.k,i=+t.dataset.i;const arr=k==='pressures'?PRESSURES:FOCUS;if(arr.length<=1){ADMIN.toast='최소 1개는 남겨두세요';break}arr.splice(i,1);break}
    case 'setedit':ADMIN.edit[t.dataset.k]=v;break;
    case 'prow':if(v==='add')ADMIN.edit.pricesArr.push([60,50000]);else{const i=+v.split(':')[1];ADMIN.edit.pricesArr.splice(i,1)}break;
    case 'canceledit':ADMIN.on=true;ADMIN.edit=null;break;
    case 'saveedit':{
      const E=ADMIN.edit;
      const nm=document.getElementById('e-name');if(nm)E.name=nm.value.trim();
      if(!E.name){ADMIN.toast='이름을 입력해주세요';break}
      if(E.kind==='course'){
        const ds=document.getElementById('e-desc');if(ds)E.desc=ds.value.trim();
        document.querySelectorAll('[data-act="pedit"]').forEach(inp=>{const i=+inp.dataset.i,k=inp.dataset.k,val=+inp.value||0;if(k==='min')E.pricesArr[i][0]=val;else E.pricesArr[i][1]=val});
        const prices={};E.pricesArr.filter(r=>r[0]>0&&r[1]>0).forEach(([m,p])=>prices[m]=p);
        if(!Object.keys(prices).length){ADMIN.toast='시간과 가격을 1개 이상 입력해주세요';break}
        const obj={id:E.id,emo:E.emo,name:E.name,tag:E.tag,desc:E.desc||'',prices};
        if(E.isNew)COURSES.push(obj);else{const i=COURSES.findIndex(x=>x.id===E.id);COURSES[i]=obj}
      }else{
        const pr=document.getElementById('e-price');if(pr)E.price=+pr.value||0;
        const obj={id:E.id,emo:E.emo,name:E.name,price:E.price};
        if(E.isNew)ADDONS.push(obj);else{const i=ADDONS.findIndex(x=>x.id===E.id);ADDONS[i]=obj}
      }
      ADMIN.on=true;ADMIN.edit=null;ADMIN.tab='menu';break;
    }
    case 'start':S.step=1;break;
    case 'home':fresh();break;
    case 'stay':idleWarn=false;idleT=0;break;
    case 'course':if(S.course!==v){S.course=v;const ks=Object.keys(course().prices);S.dur=ks.length===1?+ks[0]:null}break;
    case 'dur':S.dur=+v;break;
    case 'set':S[t.dataset.k]=v;break;
    case 'toggle':{const arr=S[t.dataset.k];const i=arr.indexOf(v);i<0?arr.push(v):arr.splice(i,1);break}
    case 'people':S.people=Math.min(4,Math.max(1,S.people+(+v)));break;
    case 'time':S.time=v;break;
    case 'key':if(S.phone.length<11)S.phone+=v;break;
    case 'keydel':S.phone=S.phone.slice(0,-1);break;
    case 'keyclr':S.phone='';break;
    case 'health':if(v.startsWith('해당 없음'))S.health=S.health.includes(v)?[]:[v];
      else{S.health=S.health.filter(h=>!h.startsWith('해당 없음'));const i=S.health.indexOf(v);i<0?S.health.push(v):S.health.splice(i,1)}break;
    case 'consent':S.consent=!S.consent;break;
    case 'pay':S.pay=v;break;
    case 'opensheet':sheetOpen=true;break;
    case 'closesheet':sheetOpen=false;break;
    case 'back':if(S.step>1)S.step--;break;
    case 'next':
      if(!canNext())return;
      if(S.step===5){S.processing=true;render();setTimeout(finish,2200);return}
      S.step++;if(S.step===4&&!S.phone)S.phone='010';break;
  }
  render();
});
document.addEventListener('pointerdown',()=>{idleT=0},{capture:true});

function finish(){
  if(!S.processing)return;
  ticketNo++;
  const c=course();
  const freeRoom=ROOMS.find(r=>!r.guest&&(S.people>=2?r.type==='커플룸':r.type==='1인실'));
  const roomName=freeRoom?freeRoom.id:'대기';
  const no='A-'+String(ticketNo).padStart(3,'0');
  const at=startAt();
  S.ticket={no,at,room:roomName};
  QUEUE.push({no,phone:fmtPhone(S.phone),course:c.name+' '+S.dur+'분',pressure:S.pressure,focus:S.focus.slice(),people:S.people,at,room:roomName,status:freeRoom?'관리중':'대기',start:freeRoom?at:null,amount:total()});
  if(freeRoom){freeRoom.guest=no;freeRoom.until=hm(new Date(Date.now()+(15+S.dur)*60000))}
  if(S.pay!=='counter'){STATS.revenue+=total();STATS.orders++}
  S.processing=false;S.step=6;doneLeft=20;render();
}

let adminTicks=0,toastT=null;
setInterval(()=>{if(ADMIN.toast&&!toastT){toastT=setTimeout(()=>{ADMIN.toast='';toastT=null;if(ADMIN.on)render()},2500)}},300);
setInterval(()=>{
  const ck=document.getElementById('clock');if(ck)ck.textContent=hm(new Date());
  const ck2=document.getElementById('clock2');if(ck2)ck2.textContent=hm(new Date());
  if(ADMIN.on===true&&ADMIN.tab!=='menu'&&!ADMIN.edit&&!ADMIN.form){adminTicks++;if(adminTicks>=5){adminTicks=0;render()}return}
  adminTicks=0;
  if(ADMIN.on)return;
  if(S.step===6){doneLeft--;if(doneLeft<=0){fresh()}render();return}
  if(S.step===0||S.processing)return;
  idleT++;
  if(!idleWarn&&idleT>=IDLE_SEC){idleWarn=true;warnLeft=IDLE_WARN;render();return}
  if(idleWarn){warnLeft--;if(warnLeft<=0){idleWarn=false;fresh()}render()}
},1000);

try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}
render();
</script>
